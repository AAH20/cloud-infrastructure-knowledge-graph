name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python -m cloudgraph.cli examples/azure-aks-commerce-snapshot.json --failed-node azure:private-dns-postgres --output generated
      - uses: actions/upload-artifact@v6
        with:
          name: cloudgraph-evidence
          path: generated/
